name: Community Management

on:
  issues:
    types: [opened, labeled]
  pull_request:
    types: [opened, synchronize]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  auto-label:
    name: Auto Label Issues & PRs
    runs-on: ubuntu-latest
    steps:
      - name: Label issues
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const labels = [];
            
            // Auto-label based on keywords
            const title = issue.title.toLowerCase();
            const body = issue.body?.toLowerCase() || '';
            
            if (title.includes('bug') || body.includes('bug') || body.includes('error')) {
              labels.push('bug');
            }
            if (title.includes('feature') || title.includes('feat') || body.includes('feature')) {
              labels.push('enhancement');
            }
            if (title.includes('docs') || body.includes('documentation')) {
              labels.push('documentation');
            }
            if (title.includes('security') || body.includes('vulnerability')) {
              labels.push('security');
            }
            if (title.includes('performance') || body.includes('performance')) {
              labels.push('performance');
            }
            
            // Add good first issue for new contributors
            const isGoodFirstIssue = body.includes('good first issue') || body.includes('beginner');
            if (isGoodFirstIssue) {
              labels.push('good first issue');
            }
            
            if (labels.length > 0) {
              await github.rest.issues.addLabels({
                issue_number: issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                labels: labels
              });
            }

      - name: Label PRs
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const labels = [];
            
            const title = pr.title.toLowerCase();
            const files = context.payload.pull_request?.changed_files || [];
            
            if (title.includes('fix') || title.includes('bug')) {
              labels.push('bug');
            }
            if (title.includes('feat') || title.includes('add')) {
              labels.push('enhancement');
            }
            if (title.includes('ci') || title.includes('workflow')) {
              labels.push('ci');
            }
            if (title.includes('docs')) {
              labels.push('documentation');
            }
            if (title.includes('refactor')) {
              labels.push('refactoring');
            }
            
            // Size labels
            if (files < 10) {
              labels.push('size:small');
            } else if (files < 50) {
              labels.push('size:medium');
            } else {
              labels.push('size:large');
            }
            
            await github.rest.issues.addLabels({
              issue_number: pr.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: labels
            });

  welcome:
    name: Welcome New Contributors
    runs-on: ubuntu-latest
    steps:
      - name: Welcome new issues
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const user = issue.user;
            
            // Check if it's a new contributor
            const { data: events } = await github.rest.issues.listEvents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number
            });
            
            // Welcome message
            const welcomeMsg = `Welcome @${user.login}! 🎉
            
Thank you for opening this issue!
- Please describe the problem clearly
- Include screenshots if relevant
- Check existing issues first
            
We appreciate your contribution!`;
            
            // Only welcome for new issues (not comments)
            if (!issue.body.includes('<!--')) {
              // Could add welcome comment here
            }

  good-first-issue:
    name: Manage Good First Issues
    runs-on: ubuntu-latest
    if: github.event_name == 'issues'
    steps:
      - name: Mark good first issues
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const labels = issue.labels.map(l => l.name);
            
            // Add good first issue label to help wanted issues without assignments
            if (!labels.includes('good first issue') && 
                (issue.body.includes('help wanted') || issue.body.includes('beginner'))) {
              await github.rest.issues.addLabels({
                issue_number: issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                labels: ['good first issue']
              });
            }

  pr-review:
    name: PR Review Reminder
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Add PR info comment
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            
            // Check if it's a draft
            if (pr.draft) {
              await github.rest.issues.createComment({
                issue_number: pr.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `📝 This is a draft PR. Please mark as ready for review when you're done!`
              });
            }

  stale-issues:
    name: Close Stale Issues
    runs-on: ubuntu-latest
    if: false  # Requires additional setup
    steps:
      - name: Close stale issues
        uses: actions/stale@v9
        with:
          days-before-stale: 60
          days-before-close: 7
          stale-issue-message: 'This issue has been stale for 60 days. Will close if no activity.'
          close-issue-message: 'Closed due to inactivity.'
          only-labels: 'needs-info'
          exempt-issue-labels: 'pinned,security'

  help-wanted:
    name: Help Wanted Automation
    runs-on: ubuntu-latest
    if: github.event_name == 'issues'
    steps:
      - name: Add help wanted to unassigned issues
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            
            // Add help wanted to issues without assignees after 7 days
            const created = new Date(issue.created_at);
            const now = new Date();
            const daysOld = Math.floor((now - created) / (1000 * 60 * 60 * 24));
            
            if (daysOld > 7 && !issue.assignee && !issue.labels.includes('help wanted')) {
              await github.rest.issues.addLabels({
                issue_number: issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                labels: ['help wanted']
              });
            }
