name: Build and Release

on:
  push:
    branches: [ master, main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: ai-phone-app
      
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'
          
      - name: Check Kotlin compilation
        run: |
          cd ai-phone-app
          ./gradlew compileDebugKotlin --no-daemon

  build:
    runs-on: ubuntu-latest
    needs: lint
    
    steps:
      - uses: actions/checkout@v4
        with:
          path: ai-phone-app
          
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'
            
      - name: Build Debug APK
        run: |
          cd ai-phone-app
          ./gradlew assembleDebug --no-daemon
          
      - name: Build Release APK
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cd ai-phone-app
          ./gradlew assembleRelease --no-daemon
          
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: ai-phone-app/app/build/outputs/apk/debug/app-debug.apk
          
      - name: Upload Release APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: ai-phone-app/app/build/outputs/apk/release/app-release.apk

  release:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v4
        with:
          path: ai-phone-app
          
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: app-debug.apk
          path: ai-phone-app/
          
      - name: Get APK Info
        id: apk-info
        run: |
          APK_SIZE=$(ls -lh ai-phone-app/app-debug.apk | awk '{print $5}')
          APK_DATE=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          echo "SIZE=$APK_SIZE" >> $GITHUB_OUTPUT
          echo "DATE=$APK_DATE" >> $GITHUB_OUTPUT
          
      - name: Generate Changelog
        id: changelog
        run: |
          cd ai-phone-app
          CHANGELOG=$(git log --pretty=format:"- %s (%h)" -n 20)
          echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ai-phone-app/app-debug.apk
          draft: false
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          body: |
            ## 🤖 AI Phone App
            
            ```
            ╔═══════════════════════════════════════════╗
            ║     AI Phone Assistant for Android        ║
            ║     Local AI (Ollama) + Cloud API        ║
            ╚═══════════════════════════════════════════╝
            ```
            
            ### 📱 Features
            - 🏠 **Local AI** - Connect to Ollama via WiFi
            - ☁️ **Cloud AI** - OpenAI & DeepSeek API support
            - 🎨 **Material You** - Dynamic colors on Android 12+
            - 🎤 **Voice Input** - Speech-to-text
            - 🔊 **TTS** - Text-to-speech responses
            - 💬 **Chat History** - Multiple conversations
            - 🎨 **Themes** - Purple, Blue, Green, Orange, Red
            - 📤 **Export** - Backup chats & settings
            
            ### 📦 Release Info
            | | |
            |---|---|
            | **Version** | ${{ github.ref_name }} |
            | **Size** | ${{ steps.apk-info.outputs.SIZE }} |
            | **Date** | ${{ steps.apk-info.outputs.DATE }} |
            | **Commit** | ${{ github.sha }} |
            
            ### 📋 Changelog
            ${{ steps.changelog.outputs.CHANGELOG }}
            
            ---
            
            ### 💾 Installation
            
            ```bash
            # Download APK below and install
            adb install app-debug.apk
            ```
            
            > ⚠️ Enable "Install from unknown sources" in Android settings
            
            ---
            
            Built with ❤️ | [Source Code](https://github.com/bitplugg/ai-phone-app)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
