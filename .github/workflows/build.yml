name: Build and Release

on:
  push:
    branches: [ master, main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: ai-phone-app
      
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'
          
      - name: Check Kotlin compilation
        run: |
          cd ai-phone-app
          ./gradlew compileDebugKotlin --no-daemon

  build:
    runs-on: ubuntu-latest
    needs: lint
    
    steps:
      - uses: actions/checkout@v4
        with:
          path: ai-phone-app
          
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'
            
      - name: Build Debug APK
        run: |
          cd ai-phone-app
          ./gradlew assembleDebug --no-daemon
          
      - name: Build Release APK
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cd ai-phone-app
          ./gradlew assembleRelease --no-daemon
          
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: ai-phone-app/app/build/outputs/apk/debug/app-debug.apk
          
      - name: Upload Release APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: ai-phone-app/app/build/outputs/apk/release/app-release.apk

  release:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - uses: actions/checkout@v4
        with:
          path: ai-phone-app
          
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: app-debug.apk
          path: ai-phone-app/
          
      - name: Generate Changelog
        id: changelog
        run: |
          cd ai-phone-app
          CHANGELOG=$(git log --pretty=format:"- %s (%h)" -n 20)
          echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ai-phone-app/app-debug.apk
          body: |
            ## Changelog
            
            ${{ steps.changelog.outputs.CHANGELOG }}
            
            ## Installation
            
            1. Download the APK below
            2. Install on your Android device
            3. Enjoy!
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
