name: Build and Release

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          path: ai-phone-app
          
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          path: ai-phone-app
          
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('ai-phone-app/**/*.gradle*', 'ai-phone-app/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
            
      - name: Build Debug APK
        run: |
          cd ai-phone-app
          ./gradlew assembleDebug --no-daemon
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: ai-phone-app/app/build/outputs/apk/debug/app-debug.apk
          
      - name: Generate Changelog
        id: changelog
        run: |
          cd ai-phone-app
          CHANGELOG=$(git log --pretty=format:"- %s (%h)" -n 20)
          echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: ai-phone-app/app/build/outputs/apk/debug/app-debug.apk
          body: |
            ## Changelog
            
            ${{ steps.changelog.outputs.CHANGELOG }}
            
            ## Installation
            
            1. Download the APK below
            2. Install on your Android device
            3. Enjoy!
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Commit APK
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cd ai-phone-app
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -f app/build/outputs/apk/debug/app-debug.apk
          git commit -m "Add APK for ${{ github.ref_name }}"
          git push
