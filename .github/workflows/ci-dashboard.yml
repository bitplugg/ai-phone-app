name: CI Dashboard

on:
  workflow_run:
    workflows: [Lint & Code Quality, Tests, Security Scan, Build, Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  checks: write

jobs:
  summarize:
    name: Generate CI Summary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get workflow runs
        id: workflows
        uses: actions/github-script@v7
        with:
          script: |
            const workflows = ['Lint & Code Quality', 'Tests', 'Security Scan', 'Build', 'Release'];
            const results = [];
            
            for (const wf of workflows) {
              try {
                const runs = await github.rest.actions.listWorkflowRuns({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: wf,
                  per_page: 1
                });
                
                if (runs.data.workflow_runs.length > 0) {
                  const run = runs.data.workflow_runs[0];
                  results.push({
                    name: wf,
                    status: run.conclusion || run.status,
                    url: run.html_url,
                    time: new Date(run.created_at).toLocaleString()
                  });
                }
              } catch (e) {
                results.push({ name: wf, status: 'not_found' });
              }
            }
            
            // Get repo stats
            const { data: repo } = await github.rest.repos.get(context.repo);
            
            const summary = {
              workflows: results,
              repo: {
                stars: repo.stargazers_count,
                forks: repo.forks_count,
                openIssues: repo.open_issues_count,
                lastPush: repo.pushed_at
              }
            };
            
            console.log(JSON.stringify(summary, null, 2));
            core.setOutput('summary', JSON.stringify(summary));

      - name: Create summary comment
        uses: actions/github-script@v7
        with:
          script: |
            const summary = JSON.parse('${{ steps.workflows.outputs.summary }}');
            
            const statusEmoji = {
              'success': '✅',
              'failure': '❌',
              'cancelled': '⏹️',
              'skipped': '⏭️',
              'in_progress': '🔄',
              'not_found': '❓'
            };
            
            let body = `## 📊 CI Dashboard\n\n`;
            body += `### 🔄 Workflow Status\n\n`;
            body += `| Workflow | Status | Time |\n`;
            body += `|---------|--------|------|\n`;
            
            for (const wf of summary.workflows) {
              const emoji = statusEmoji[wf.status] || '❓';
              body += `| [${wf.name}](${wf.url || '#'}) | ${emoji} ${wf.status} | ${wf.time || '-'} |\n`;
            }
            
            body += `\n### 📈 Repository Stats\n\n`;
            body += `- ⭐ Stars: ${summary.repo.stars}\n`;
            body += `- 🍴 Forks: ${summary.repo.forks}\n`;
            body += `- 📝 Open Issues: ${summary.repo.openIssues}\n`;
            body += `- �:last_push: Last push: ${new Date(summary.repo.lastPush).toLocaleString()}\n`;
            
            body += `\n### 🔗 Quick Links\n`;
            body += `- [Actions](${context.repo.url}/actions)\n`;
            body += `- [Issues](${context.repo.url}/issues)\n`;
            body += `- [Releases](${context.repo.url}/releases)\n`;
            
            // Find the run
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ci-dashboard.yml',
              per_page: 1
            });
            
            // Update or create issue comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: runs.data.workflow_runs[0].id,
              per_page: 1
            });
            
            if (comments.length > 0) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: comments[0].id,
                body: body
              });
            }

      - name: Create issue with summary
        if: false
        uses: actions/github-script@v7
        with:
          script: |
            const summary = JSON.parse('${{ steps.workflows.outputs.summary }}');
            
            // Create or update a pinned issue with dashboard
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: ['ci-dashboard']
            });
            
            const body = `## 📊 CI Dashboard (Auto-generated)
            
Updated: ${new Date().toLocaleString()}
            
### Workflow Results
See GitHub Actions tab for details.
`;
            
            if (issues.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '📊 CI Dashboard',
                body: body,
                labels: ['ci-dashboard', 'automated']
              });
            }

  build-summary:
    name: Build Summary from Artifacts
    runs-on: ubuntu-latest
    needs: summarize
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
        continue-on-error: true

      - name: Generate build report
        run: |
          echo "## Build Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -d "artifacts" ]; then
            echo "### Artifacts" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            find artifacts -type f -name "*.apk" | while read f; do
              SIZE=$(du -h "$f" | cut -f1)
              echo "- \`$f\` ($SIZE)" >> $GITHUB_STEP_SUMMARY
            done
          else
            echo "No artifacts found" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Build completed at: $(date)" >> $GITHUB_STEP_SUMMARY

  notify-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    if: failure()
    steps:
      - name: Get failed workflow info
        uses: actions/github-script@v7
        with:
          script: |
            const workflows = context.payload.workflow_run;
            
            // Send Telegram notification
            const message = `❌ CI Failed: ${workflows.name}`;
            
            console.log('Would send notification:', message);

      - name: Create issue on failure
        if: false
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `❌ CI Failed: ${run.name}`,
              body: `## CI Failure Report
              
**Workflow:** ${run.name}
**Run:** ${run.html_url}
**Conclusion:** ${run.conclusion}

Please check the logs and fix the issue!
`,
              labels: ['ci', 'bug', 'automated']
            });

  pr-status:
    name: Update PR Status
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Update PR status
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            
            // Get latest workflow run
            const runs = await github.rest.actions.listWorkflowRunsFor({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: pr.head.ref,
              per_page: 1
            });
            
            if (runs.data.workflow_runs.length > 0) {
              const latestRun = runs.data.workflow_runs[0];
              
              // Update commit status
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: pr.head.sha,
                state: latestRun.conclusion === 'success' ? 'success' : 'failure',
                target_url: latestRun.html_url,
                description: `CI: ${latestRun.conclusion || latestRun.status}`
              });
            }
