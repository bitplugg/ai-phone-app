name: Build Statistics

on:
  push:
    branches: [master, main]
  workflow_run:
    workflows: [Build]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-time:
    name: Track Build Time
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Measure clean build time
        run: |
          START=$(date +%s)
          ./gradlew clean assembleDebug --no-daemon
          END=$(date +%s)
          BUILD_TIME=$((END - START))
          echo "Clean build time: $BUILD_TIME seconds"
          echo "BUILD_TIME=$BUILD_TIME" >> $GITHUB_OUTPUT
        id: clean_build

      - name: Measure incremental build time
        run: |
          START=$(date +%s)
          ./gradlew assembleDebug --no-daemon
          END=$(date +%s)
          BUILD_TIME=$((END - START))
          echo "Incremental build time: $BUILD_TIME seconds"
          echo "INCREMENTAL_TIME=$BUILD_TIME" >> $GITHUB_OUTPUT
        id: incr_build

      - name: Create build stats comment
        uses: actions/github-script@v7
        with:
          script: |
            const cleanTime = '${{ steps.clean_build.outputs.BUILD_TIME }}';
            const incrTime = '${{ steps.incr_build.outputs.INCREMENTAL_TIME }}';
            const avgClean = parseInt(cleanTime);
            const avgIncr = parseInt(incrTime);
            
            console.log(`Clean build: ${avgClean}s`);
            console.log(`Incremental: ${avgIncr}s`);
            
            // Store in workflow run summary
            summary += `\n### Build Statistics\n`;
            summary += `| Type | Time |\n`;
            summary += `|------|------|\n`;
            summary += `| Clean Build | ${avgClean}s |\n`;
            summary += `| Incremental | ${avgIncr}s |\n`;
            
            // Check for significant regression
            if (avgClean > 300) {
              console.log('Warning: Clean build time exceeds 5 minutes');
            }

  apk-size-tracking:
    name: APK Size Tracking
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Get APK size
        id: apk_size
        run: |
          APK_SIZE=$(stat -f%z app/build/outputs/apk/debug/app-debug.apk 2>/dev/null || stat -c%s app/build/outputs/apk/debug/app-debug.apk)
          APK_SIZE_MB=$(echo "scale=2; $APK_SIZE / 1024 / 1024" | bc)
          echo "APK Size: $APK_SIZE_MB MB"
          echo "APK_SIZE=$APK_SIZE" >> $GITHUB_OUTPUT
          echo "APK_SIZE_MB=$APK_SIZE_MB" >> $GITHUB_OUTPUT

      - name: Create size badge
        if: env.ACCESS_TOKEN != ''
        run: |
          SIZE=${{ steps.apk_size.outputs.APK_SIZE_MB }}
          # Generate simple badge (would need additional setup for proper badges)

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const size = '${{ steps.apk_size.outputs.APK_SIZE_MB }}';
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `📦 APK Size: ${size} MB`
            })

  memory-analysis:
    name: Memory Usage Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build with memory profiling
        run: |
          ./gradlew assembleDebug \
            -Dorg.gradle.jvmargs="-Xmx4096m -XX:+HeapDumpOnOutOfMemoryError" \
            --no-daemon \
            --info 2>&1 | tee build.log

      - name: Analyze memory
        run: |
          # Extract memory info from build log
          if grep -q "heap" build.log; then
            echo "Memory info found in build log"
          fi
          
          # Check for OOM
          if grep -q "OutOfMemoryError" build.log; then
            echo "::warning::OutOfMemoryError detected in build"
          fi

  cache-stats:
    name: Cache Statistics
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Show cache size
        run: |
          echo "Gradle cache location: ~/.gradle/caches"
          if [ -d ~/.gradle/caches ]; then
            du -sh ~/.gradle/caches 2>/dev/null || echo "Cache size: unknown"
          fi

      - name: Cache hit rate analysis
        run: |
          # Run build twice to measure cache effectiveness
          ./gradlew clean --no-daemon
          ./gradlew assembleDebug --no-daemon --build-cache
          FIRST_BUILD=$?
          
          ./gradlew assembleDebug --no-daemon --build-cache
          SECOND_BUILD=$?
          
          echo "First build (cold cache): $FIRST_BUILD"
          echo "Second build (warm cache): $SECOND_BUILD"

  dashboard:
    name: Build Dashboard Summary
    runs-on: ubuntu-latest
    needs: [build-time, apk-size-tracking]
    if: always()
    steps:
      - name: Create summary
        run: |
          echo "## Build Statistics Dashboard" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| APK Size | ${{ needs.apk-size-tracking.outputs.APK_SIZE_MB || 'N/A' }} MB |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Last updated: $(date)" >> $GITHUB_STEP_SUMMARY
